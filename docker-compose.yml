services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vros_lab6
      POSTGRES_USER: vros
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vros}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - vros_lab6_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vros -d vros_lab6"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  vros_lab6_pgdata:
