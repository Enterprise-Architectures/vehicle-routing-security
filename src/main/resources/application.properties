spring.application.name=vros
spring.main.web-application-type=servlet

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:vros_lab6}
spring.datasource.username=${DB_USER:vros}
spring.datasource.password=${DB_PASSWORD:vros}

# SQL creates the tables, Hibernate only validates the mapping.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Optional demonstration. Disabled by default; activate with --vros.demo.enabled=true.
vros.demo.enabled=false

# Lab 5 REST and Swagger UI. Port 8080 is already used by GridLab.
server.port=8081

# Secure by default. Select dev or compulsory only when intentionally demonstrating them.
spring.profiles.default=prod
